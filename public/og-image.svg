<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#050508"/>
  
  <!-- Geometric accents -->
  <rect x="80" y="80" width="80" height="80" rx="4" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <rect x="100" y="100" width="40" height="40" rx="2" fill="url(#gold)" opacity="0.15"/>
  
  <rect x="1040" y="470" width="80" height="80" rx="4" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <rect x="1060" y="490" width="40" height="40" rx="2" fill="url(#gold)" opacity="0.15"/>
  
