  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f0ede6" text-anchor="middle" letter-spacing="-2">Ahmed Ali</text>
  
  <!-- Title -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#d4af37" text-anchor="middle" letter-spacing="4">FULL-STACK DEVELOPER &amp; SYSTEMS ARCHITECT</text>
  
